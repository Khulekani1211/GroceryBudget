<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../src/css/main.css">
  <script src="../src/js/bootstrap.bundle.min.js"></script>
  <title>Grocery Budget</title>
</head>
<body>
  <div class="logo">
    <img src="img/Budget_Logo.svg" class="mx-auto d-block m-3" alt="Logo" width="200px">
  </div>

  <div class="container-sm py-3 px-5" id="main-wrapper">
    <label for="budget">Budget</label>
    <div class="input-group flex-nowrap">
      <span class="input-group-text" id="addon-wrapping">R</span>
      <input type="text" class="form-control" placeholder="0.00" aria-label="Username" aria-describedby="addon-wrapping">
    </div>
    <div class="default-items">
      <div>
        <label for="grocery-item" class="mt-2">Grocery Item</label>
        <select class="form-select" id="grocery-item" aria-label="Default select example">
          <option selected>Select Item</option>
          <option value="1">Mince Meat</option>
          <option value="2">Beef</option>
          <option value="3">Chicken</option>
          <option value="4">Eggs</option>
          <option value="5">Mayonnaise</option>
          <option value="6">Rice</option>
          <option value="7">Maize Meal</option>
          <option value="8">Sphaghetti</option>
          <option value="9">Maccaroni</option>
          <option value="10">Instant Noodles</option>
          <option value="11">Peanut Butter</option>
          <option value="12">Cheese</option>
          <option value="13">Cold Meat</option>
          <option value="14">Cooking Oil</option>
          <option value="15">Magarine</option>
          <option value="16">Cornflakes</option>
          <option value="17">Granula</option>
          <option value="18">Muesli</option>
          <option value="19">Fresh Milk</option>
          <option value="20">Toilet Paper</option>
          <option value="21">Tooth Paste</option>
          <option value="22">Bath Soap</option>
          <option value="23">Deodarant</option>
          <option value="24">Shower Gel</option>
          <option value="25">Moisturizer Men</option>
          <option value="26">Moisturizer Women</option>
          <option value="27">Powder Milk</option>
        </select>
      </div>
      
      <div class="two">
        <label for="quantity" id="qty">Qty</label>
        <input type="number" name="Quantity" placeholder="x 1" id="quantity">
      </div>
      
    </div>
    
    
    <div class="input-group flex-nowrap">
      <span class="input-group-text" id="addon-wrapping">R</span>
      <input type="text" class="form-control" placeholder="0.00" aria-label="Username" aria-describedby="addon-wrapping">
    </div>

    <button type="button" class="btn btn-success">Add Item</button>


    <label for="custom-item">Custom Item</label>
    <div class="input-group flex-nowrap">
      <input type="text" class="form-control" placeholder="Enter Item" aria-label="Username" aria-describedby="addon-wrapping">
    </div>

    <label for="quantity">Qty</label>
    <input type="number" name="Quantity" placeholder="x 1" id="quantity">
    
    <div class="input-group flex-nowrap">
      <span class="input-group-text" id="addon-wrapping">R</span>
      <input type="text" class="form-control" placeholder="0.00" aria-label="Username" aria-describedby="addon-wrapping">
    </div>

    <button type="button" class="btn btn-success">Add Item</button>

    <div class="container-sm" id="sum-wrapper">

      <div class="amounts">

        <div class="budget-amount">
          <span class="budget">Budget Amount</span>
          <span class="budget-total">R<span id="budgetTotal">0.00</span></span>
        </div>
  
        <div class="amount-spent">
          <span class="total">Amount Spent</span>
          <span class="spend-total">R<span id="spendTotal">0.00</span></span>
        </div>
        
      </div>

      <div class="item-summary">
        <h1>Items & Cost</h1>
      </div>
    </div>

  </div>

  
  
  <script src="../src/js/main.js"></script>
</body>
</html>
